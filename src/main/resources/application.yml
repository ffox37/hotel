spring:
  application:
    name: hotel
  liquibase:
    enabled: false
    default-schema: hotel
  datasource:
    url: jdbc:h2:file:./db
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
