databaseChangeLog:
  - changeSet:
      id: create_amenity_table
      author: Svyatoslav
      changes:
        - createTable:
            tableName: amenity
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false